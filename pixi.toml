[project]
name = "mamba"
version = "0.1.0"
description = "Add a short description here"
authors = ["Wolf Vollprecht <w.vollprecht@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tasks]
cmake = "mkdir -p ./build && cd ./build && cmake .. -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DBUILD_MICROMAMBA=1 -DBUILD_LIBMAMBA=1 -DBUILD_SHARED=1"
build = { cmd = "cd ./build && ninja", depends_on = ["cmake"] }
start = { cmd = "./build/micromamba/micromamba"}

[dependencies]
cxx-compiler = "*"
cmake = ">=3.16"
ninja = "*"
nlohmann_json = "*"
libsolv = ">=0.7.18"
libarchive = "*"
libsodium = "*"
libcurl = ">=7.86"
doctest = "*"
cpp-expected = "*"
reproc-cpp = "*"
yaml-cpp = ">=0.8.0"
cli11 = ">=2.2"
spdlog = "*"
fmt = "*"

[target.win-64.dependencies]
winreg = "*"
